name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure debug keystore exists
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -v -keystore keystore/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Debug,O=ChessAnalyzer,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chessanalyzer-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit keystore if newly created
        run: |
          if [ -n "$(git status --porcelain keystore/)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f keystore/debug.keystore
            git commit -m "Add persistent debug keystore [skip ci]"
            git push
          fi
